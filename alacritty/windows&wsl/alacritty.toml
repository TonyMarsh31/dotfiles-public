[general]
live_config_reload = true
working_directory = "//wsl.localhost/Ubuntu/home/tony"

[terminal.shell]
program = "C:/WINDOWS/system32/wsl.exe -d Ubuntu"

[env]
TERM = "xterm-256color"

[scrolling]
multiplier = 3

[debug]
log_level = "Warn"
persistent_logging = false
print_events = false
render_timer = false

[cursor]
blink_interval = 750
unfocused_hollow = true
style = { blinking = "Always", shape = "Beam" }

[window]
title = "shell"
dynamic_title = false
decorations = "None"
dynamic_padding = true
opacity = 0.95
startup_mode = "Maximized"
padding = { x = 2, y = 2 }


[colors]
indexed_colors = [{ color = '#242831', index = 16 }]

[colors.primary]

background = '#041419'
dim_foreground = '#a5abb6'
foreground = '#d8dee9'

[colors.normal]
black = '#3b4252'
red = '#bf616a'
green = '#a3be8c'
yellow = '#ebcb8b'
blue = '#81a1c1'
magenta = '#b48ead'
cyan = '#88c0d0'
white = '#e5e9f0'

[colors.bright]
black = '#4c566a'
red = '#bf616a'
green = '#a3be8c'
yellow = '#ebcb8b'
blue = '#81a1c1'
magenta = '#b48ead'
cyan = '#8fbcbb'
white = '#eceff4'

[colors.dim]
black = '#373e4d'
red = '#94545d'
green = '#809575'
yellow = '#b29e75'
blue = '#68809a'
magenta = '#8c738c'
cyan = '#6d96a5'
white = '#aeb3bb'

[colors.cursor]
cursor = '#d8dee9'
text = '#041419'

[colors.selection]
background = '#4c566a'
text = 'CellForeground'

[colors.search.matches]
background = '#88c0d0'
foreground = 'CellBackground'

[colors.vi_mode_cursor]
cursor = '#c89532'
text = '#041419'

[font]
size = 14
glyph_offset = { x = 0, y = 0 }
normal = { family = "Blex_LXGW_NF_Mono", style = "Regular" }
bold = { family = "BlexMono Nerd Font", style = "Bold" }
italic = { family = "BlexMono Nerd Font", style = "Italic" }
bold_italic = { family = "BlexMono Nerd Font", style = "Bold Italic" }

[[mouse.bindings]]
action = "Copy"
mouse = "Forward"

# bindings = [{ <key>, <mods>, <mode>, <action> | <chars> },]
[keyboard]
bindings = [

    # fix Control-/ 
    # source: https://github.com/alacritty/alacritty/issues/6586
    { key = "Slash", mods = "Control", chars = "\u001f" },

    #  font size change
    { key = "Equals", mods = "Control", action = "IncreaseFontSize" },
    { key = "Minus", mods = "Control", action = "DecreaseFontSize" },
    { key = "Key0", mods = "Control", action = "ResetFontSize" },

    # copy & paste
    { key = "Y", mods = "Control", action = "Copy" },      # normal mode
    { key = "P", mods = "Control", action = "Paste" },
    { key = "Y", mode = "Vi", action = "Copy" },           # vim mode
    { key = "Y", mode = "Vi", action = "ClearSelection" }, # after yank in vim mode , clear selection
    { key = "P", mode = "Vi", action = "Paste" },


    # VIM MODE
    # toggle vim mode
    { key = "Space", mods = "Control", action = "ToggleViMode" },
    { key = "Space", mods = "Control", mode = "Vi", action = "ScrollToBottom" }, # after exit vim mode, scroll to bottom
    # Selection
    { key = "V", mods = "Shift", mode = "Vi", action = "ToggleLineSelection" },
    { key = "Escape", mode = "Vi", action = "ClearSelection" },
    # Scroll
    { key = "U", mods = "Control", mode = "Vi", action = "ScrollHalfPageUp" },
    { key = "D", mods = "Control", mode = "Vi", action = "ScrollHalfPageDown" },

    { key = "B", mode = "Vi", action = "SemanticLeft" },
    { key = "W", mode = "Vi", action = "SemanticRight" },
    { key = "E", mode = "Vi", action = "SemanticRightEnd" },
    { key = "B", mods = "Shift", mode = "Vi", action = "WordLeft" },
    { key = "W", mods = "Shift", mode = "Vi", action = "WordRight" },
    { key = "E", mods = "Shift", mode = "Vi", action = "WordRightEnd" },

    # Search
    { key = "Slash", mode = "Vi", action = "SearchForward" },
    { key = "N", mode = "Vi", action = "SearchNext" },
    { key = "Slash", mods = "Shift", mode = "Vi", action = "SearchBackward" },
    { key = "N", mods = "Shift", mode = "Vi", action = "SearchPrevious" },
]